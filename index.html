          <h1>Flash Bitaxe, NerdAxe, and custom firmware directly from your browser.</h1>
          <p>A precise, browser-based installer for Bitaxe, NerdAxe, and custom Bitcoin mining firmware builds.</p>
          <h2>Supported firmware and hardware</h2>
          <p>The live model and rollback-version lists are generated from official ESP-Miner and BAP-GT-TOUCH releases. Select the exact model and printed Bitaxe board number. NerdAxe hardware is matched automatically from the selected model. Turbo Touch screen firmware updates only the display controller, not the Bitaxe GT miner inside the unit.</p>
          <h2>How the browser flasher works</h2>
          <ol><li>Connect the miner and approve its USB serial device.</li><li>Choose Bitaxe or NerdAxe.</li><li>Choose the latest-release or prerelease channel.</li><li>Select the exact miner model.</li><li>Match the Bitaxe board revision or review the automatically matched NerdAxe board.</li><li>Select a compatible firmware version.</li><li>Choose whether to preserve miner settings.</li><li>Install the verified release and maintain USB and power until the miner restarts.</li></ol>
          <p>After a compatible version is selected, the browser prepares and verifies that matching firmware. Changing the hardware or version prepares the newly matched file.</p>
          <h2>Verification and source transparency</h2>
          <p>Release automation verifies firmware against upstream GitHub digests. The browser independently checks the SHA-256 checksum before flashing. Corresponding source archives and upstream release pages are linked for inspection.</p>
          <h2>Advanced custom firmware</h2>
          <p>The Advanced tool can install a local merged, bootable ESP32-S3 firmware file built for address 0x0. The file remains in browser memory and is never uploaded. Custom firmware is not verified for authenticity or hardware compatibility, does not preserve settings, and is used entirely at the user's risk.</p>
          <h2>Frequently asked questions</h2>
          <h3>How do I flash firmware with the Solo Satoshi Web Flasher?</h3><p>Connect and approve the miner's USB serial device, select the exact supported hardware and firmware, choose whether to preserve settings, then keep USB and power connected while the verified release installs and the miner restarts.</p>
          <h3>Which browsers support the web flasher?</h3><p>Use a current desktop version of Google Chrome, Microsoft Edge, or Brave with Web Serial support. Safari, Firefox, and mobile browsers do not currently support USB flashing with this tool.</p>
          <h3>Can the flasher preserve my miner settings?</h3><p>Yes. Preserve miner settings leaves the device NVS settings area untouched while updating the remaining firmware. Record important settings before every update as a precaution.</p>
          <h3>Where does the firmware come from?</h3><p>Firmware comes from the official ESP-Miner repositories for Bitaxe and NerdAxe devices. Every listed file links to its upstream GitHub release and corresponding source archive.</p>
          <h3>Does Turbo Touch screen firmware update the miner inside it?</h3><p>No. Bitaxe Turbo Touch — Screen Only updates the touchscreen ESP32-S3 controller through its USB port. It does not update the internal Bitaxe GT miner.</p>
          <h3>Can I test prerelease firmware?</h3><p>When an official prerelease is newer than the latest production release, select the Prereleases channel. If none is eligible, the option is disabled and Latest Releases is selected automatically.</p>
          <h3>What happens if I change my firmware selection?</h3><p>The install button always uses the image matched to the current selections. A changed selection prepares and verifies its matching image before writing.</p>
          <h3>Can I flash my own compiled firmware?</h3><p>Yes. Use the Advanced tool with a merged, bootable ESP32-S3 .bin built for address 0x0. The file is processed locally and never uploaded. You are solely responsible for its origin, contents, layout, and compatibility.</p>
          <h3>How do I put my miner into bootloader mode?</h3><p>The browser can connect to the USB serial port even when the ESP32 bootloader is not active. If flashing does not start, hold BOOT, press and release RESET while continuing to hold BOOT, then release BOOT. Select Retry flashing. Some miners enter bootloader mode automatically and do not require this sequence.</p>
