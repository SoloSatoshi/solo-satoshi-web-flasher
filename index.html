          <h1>Flash Bitaxe, NerdAxe, and custom firmware directly from your browser.</h1>

          <h2>Supported firmware and hardware</h2>
          <p>The flasher automatically discovers official releases and offers the newest stable release plus up to five earlier stable versions only when each release contains a factory image for the selected hardware. New hardware cannot be rolled back to firmware released before support for that hardware was added. Turbo Touch screen firmware updates only the display controller, not the Bitaxe GT miner inside the unit.</p>
          <h2>How the browser flasher works</h2>

          <p>After a compatible version is selected, the browser prepares and verifies that matching firmware. Changing the hardware or version prepares the newly matched file.</p>
          <h2>Verification and source transparency</h2>
          <p>For listed releases, release automation checks the approved upstream repository, expected file, size, and SHA-256 digest published by GitHub. The browser checks the size and SHA-256 again before writing, and the ESP flashing library verifies the completed write. These checks confirm that the bytes match the listed release; they do not guarantee that firmware is bug-free or suitable for every configuration. Corresponding source archives and upstream release pages are linked for inspection.</p>

          <p>Yes. Advanced accepts a local merged, bootable ESP32-S3 .bin built for address 0x0, up to 32 MB. The browser checks its basic image structure and confirms that the connected chip is an ESP32-S3 before writing. The file is never uploaded, but its authenticity, safety, and hardware compatibility cannot be verified. Advanced replaces the complete image without preserving settings, and you are solely responsible for using it.</p>
